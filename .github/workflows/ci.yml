name: CI

# Every push to any branch, and every pull request.
on:
  push:
  pull_request:

# The jobs only need to read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # charlock_holmes, one of Decidim's gems, compiles against ICU.
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libicu-dev

      # Ruby from .ruby-version, Bundler from Gemfile.lock; installed gems are cached.
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: RuboCop
        run: bundle exec rubocop

      # The stylesheet, with Decidim's own stylelint configuration.
      - name: Stylelint
        run: npm run stylelint

  specs:
    name: Specs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # The PostgreSQL version of compose.yaml.
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: decidim
          POSTGRES_PASSWORD: decidim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username decidim --dbname postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_HOST: localhost
      DATABASE_USERNAME: decidim
      DATABASE_PASSWORD: decidim
      DISABLE_SPRING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # charlock_holmes compiles against ICU; Decidim does not boot without
      # libvips and ImageMagick.
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libicu-dev libvips42t64 imagemagick

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # A clean Decidim with the module in it (spec/decidim_dummy_app), and
      # its database.
      - name: Generate the test application
        run: bundle exec rake test_app

      - name: Compile its assets
        working-directory: spec/decidim_dummy_app
        run: RAILS_ENV=test bundle exec rails shakapacker:compile

      # The rule, the guard on Decidim, and the pages drawn in the Chrome the
      # runner image carries.
      - name: RSpec
        run: bundle exec rspec
